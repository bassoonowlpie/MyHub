name: Update Indices

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/update-indices.yml'
  schedule:
    # 每 30 分鐘更新一次（UTC 時間）
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch indices
        run: node scripts/update-indices.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indices.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: update indices [skip ci]"
            git push
          fi
